<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RelateAnything 测试图片与标注</title><style>
body{font:16px system-ui,sans-serif;margin:0;background:#f3f5f7;color:#18242e}main{max-width:1200px;margin:auto;padding:24px;overflow-wrap:anywhere}label{display:flex;align-items:center;gap:10px;margin:12px 0;flex-wrap:wrap}select{font:inherit;padding:7px;max-width:100%;min-width:0}.grid{display:grid;grid-template-columns:3fr 2fr;gap:20px}.panel{background:white;padding:18px;min-width:0;overflow-wrap:anywhere}svg{width:100%;height:auto}li{margin:6px 0}a{color:#076778}.scroll{overflow-x:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:7px;text-align:left}@media(max-width:800px){main{padding:12px}.grid{grid-template-columns:1fr}}
</style><main><h1>测试图片、框与原始标注</h1><p>图片和标注均来自固定版本的公开数据。未标注关系不能视为负例；这里只显示已有标注。</p><label>数据集<select id="suite"></select></label><label>样本<select id="sample"></select></label><p id="source"></p><div class="grid"><div class="panel" id="picture"></div><div class="panel"><h2>对象</h2><ol id="objects" start="0"></ol><h2>关系标注</h2><ol id="relations"></ol></div></div><div class="panel"><h2>有明确正负标签的关系</h2><div class="scroll"><table><thead><tr><th>subject → object</th><th>谓词</th><th>标签</th></tr></thead><tbody id="cells"></tbody></table></div><h2>自动填充数据</h2><p>路径相对解压后的 relateanything_test_data 目录；框使用像素 XYXY，类别与框一一对应。</p><pre id="autofill"></pre><a href="catalog.json">完整自动填充清单</a> · <a id="annotation">原始标注清单</a> · <a id="original">打开原图</a></div></main>
<script>const D=__TEST_DATA__;
const $=id=>document.getElementById(id), esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function options(id,rows){$(id).replaceChildren(...rows.map(([value,label])=>{const o=document.createElement('option');o.value=value;o.textContent=label;return o}));}
function render(){const index=+$('sample').value,s=D.samples[index],suite=D.suites.find(v=>v.id===s.suite),im=new Image();im.onload=()=>{if(+$('sample').value!==index)return;let svg=`<svg data-sample="${index}" viewBox="0 0 ${im.naturalWidth} ${im.naturalHeight}" xmlns="http://www.w3.org/2000/svg"><image href="${esc(s.image)}" width="${im.naturalWidth}" height="${im.naturalHeight}"/>`;s.objects.forEach((o,i)=>{const[x,y,x2,y2]=o.box_xyxy;svg+=`<rect x="${x}" y="${y}" width="${x2-x}" height="${y2-y}" fill="none" stroke="#50ddff" stroke-width="2"/><text x="${x}" y="${Math.max(16,y)}" font-size="15" fill="white" stroke="black" stroke-width="2" paint-order="stroke">${i}: ${esc(o.name)}</text>`});$('picture').innerHTML=svg+'</svg>';};im.onerror=()=>{if(+$('sample').value===index)$('picture').textContent='图片无法加载：'+s.image};im.src=s.image;
$('source').textContent=`${suite.source} · ${suite.split} · revision ${suite.revision} · image ${s.image_id}${s.inference_ready?'':' · 缺少足够的标注对象，自动填充时跳过'}`;$('objects').innerHTML=s.objects.map(o=>`<li>${esc(o.name)} [${o.box_xyxy.join(', ')}]</li>`).join('');$('relations').innerHTML=s.relations.length?s.relations.map(r=>`<li>${r.subject} → ${r.object}: ${esc(r.predicate)}</li>`).join(''):'<li>此样本没有已标注正关系</li>';$('cells').innerHTML=s.labelled_cells.length?s.labelled_cells.map(r=>`<tr><td>${r.subject} → ${r.object}</td><td>${esc(r.predicate)}</td><td>${r.label?'正':'负'}</td></tr>`).join(''):'<tr><td colspan="3">此数据集没有显式负例标签</td></tr>';$('autofill').textContent=JSON.stringify({image:s.image,boxes_xyxy:s.boxes_xyxy,object_names:s.object_names},null,2);$('annotation').href=s.annotation_manifest;$('original').href=s.image;}
function samples(){options('sample',D.samples.map((s,i)=>[i,s]).filter(([,s])=>s.suite===$('suite').value).map(([i,s])=>[i,String(s.image_id)]));render();}options('suite',D.suites.map(s=>[s.id,`${s.id} (${s.samples})`]));$('suite').onchange=samples;$('sample').onchange=render;samples();
</script></html>
